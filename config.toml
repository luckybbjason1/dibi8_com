# Hugo Configuration for dibi8.com
baseURL = "https://dibi8.com/"
title = "Dibi8 - AI工具目录"
theme = "PaperMod"

# Enable pluralize link titles
pluralizelisttitles = true

# Content directory - use CN folder
contentDir = "CN"

# Output format
enableRobotsTXT = true
enableGitInfo = false

# Sitemap configuration
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"
  collection = "collections"

# Languages configuration - only Chinese (CN) as source
[languages.zh]
  weight = 1
  title = "Dibi8 - AI工具目录"
  label = "中文"  # Use label instead of languageName
  contentDir = "CN"

# Menu configuration
[[menu.main]]
  identifier = "categories"
  name = "分类"
  pageRef = "categories"
  weight = 10

[[menu.main]]
  identifier = "tools"
  name = "工具"
  pageRef = "tools"
  weight = 20

[[menu.main]]
  identifier = "collections"
  name = "合集"
  pageRef = "collections"
  weight = 30

# Params
[params]
  env = "production"
  description = "发现最佳AI工具，比较功能、价格和评价"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  
  # Social links
  [params.social]
    GitHub = "luckybbjason1"
    Telegram = "https://t.me/DIBI8_Group"

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
