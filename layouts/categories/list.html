{{- define "main" }}
<div class="min-h-screen bg-deep-900">
    <div class="max-w-7xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-3">{{ .Title }}</h1>
            <p class="text-gray-400">浏览 {{ len .Site.Taxonomies.categories }} 个工具分类</p>
        </header>

        <!-- Categories Grid -->
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            {{ range .Site.Taxonomies.categories }}
            <a href="{{ .Page.RelPermalink }}" class="glass-card p-6 hover:border-neon-purple/50 transition-all group" aria-label="{{ .Page.LinkTitle }}">
                <div class="flex items-start justify-between mb-4">
                    <div class="dimension-card__icon-wrap w-12 h-12" style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(34, 211, 238, 0.2));">
                        <i class="fas fa-folder text-neon-purple"></i>
                    </div>
                    <span class="text-xs font-mono text-gray-500 bg-white/5 px-3 py-1 rounded-full">{{ .Count }} 篇文章</span>
                </div>
                <h2 class="text-lg font-bold text-white mb-2 group-hover:text-neon-purple transition-colors">
                    {{ .Page.LinkTitle }}
                </h2>
                <p class="text-gray-500 text-sm line-clamp-2">{{ .Page.Description | default "查看该分类下的所有工具" }}</p>
            </a>
            {{ end }}
        </div>

        <!-- View All Tools Link -->
        <div class="text-center mt-12">
            <a href="/categories/all/" class="btn btn--secondary inline-flex items-center gap-2">
                查看全部 {{ len .Site.RegularPages }} 个工具
                <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </a>
        </div>

        <!-- Schema.org Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebPage",
            "name": "{{ .Title }}",
            "description": "浏览 {{ len .Site.Taxonomies.categories }} 个AI工具分类",
            "url": "{{ .Permalink }}",
            "about": {
                "@type": "WebCategorySet",
                "name": "AI工具分类",
                "numberOfItems": {{ len .Site.Taxonomies.categories }}
            }
        }
        </script>
    </div>
</div>
{{- end }}
