<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "zh-CN" }}" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Dibi8</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}发现最佳AI工具，比较功能、价格和评价{{ end }}">
    <meta name="keywords" content="AI工具,人工智能,工具导航,Dibi8">
    <meta name="author" content="Dibi8 Team">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
    <meta name="theme-color" content="#0a0a0f">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:title" content="{{ .Title }} | Dibi8">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}发现最佳AI工具{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="Dibi8">
    <meta property="og:locale" content="zh_CN">
    {{ if .IsPage }}
    <meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
    <meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
    {{ with .Params.tags }}
    {{ range first 3 . }}
    <meta property="article:tag" content="{{ . }}">
    {{ end }}
    {{ end }}
    {{ end }}
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }} | Dibi8">
    <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}发现最佳AI工具{{ end }}">
    <meta name="twitter:url" content="{{ .Permalink }}">
    
    <link rel="canonical" href="{{ .Permalink }}">
    
    <!-- RSS Feed -->
    {{ if .IsHome }}
    <link rel="alternate" type="application/rss+xml" title="Dibi8 RSS" href="/index.xml">
    {{ else }}
    <link rel="alternate" type="application/rss+xml" title="{{ .Title }} - Dibi8" href="/index.xml">
    {{ end }}
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              deep: {
                900: '#0a0a0f',
                800: '#12121a',
                700: '#1e1e2e',
              },
              neon: {
                purple: '#7c3aed',
                cyan: '#06b6d4',
                pink: '#ec4899',
                green: '#10b981',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'gradient': 'gradient 8s ease infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              gradient: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              glow: {
                'from': { boxShadow: '0 0 20px rgba(124, 58, 237, 0.3)' },
                'to': { boxShadow: '0 0 40px rgba(124, 58, 237, 0.6)' },
              }
            }
          }
        }
      }
    </script>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="/css/bento-design-system.css">
    
    <style>
        /* Critical inline styles */
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #12121a; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #7c3aed, #06b6d4); 
            border-radius: 4px;
        }
        
        /* Prose styling for articles */
        .prose-dibi {
            color: #e2e8f0;
            line-height: 1.8;
        }
        .prose-dibi h1, .prose-dibi h2, .prose-dibi h3, .prose-dibi h4 {
            color: #f8fafc;
            font-weight: 700;
            margin-top: 2em;
            margin-bottom: 1em;
        }
        .prose-dibi h2 { 
            font-size: 1.75rem; 
            padding-top: 1.5em; 
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .prose-dibi h3 { font-size: 1.4rem; }
        .prose-dibi p { margin: 1.2em 0; }
        .prose-dibi a {
            color: #7c3aed;
            text-decoration: none;
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
            transition: all 0.2s ease;
        }
        .prose-dibi a:hover {
            color: #06b6d4;
            border-bottom-color: #06b6d4;
        }
        .prose-dibi code {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.2em 0.4em;
            border-radius: 0.375rem;
            font-size: 0.875em;
            font-family: 'JetBrains Mono', monospace;
            color: #e2e8f0;
        }
        .prose-dibi pre {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.75rem;
            padding: 1.25rem;
            overflow-x: auto;
            margin: 1.5em 0;
        }
        .prose-dibi pre code {
            background: none;
            border: none;
            padding: 0;
            color: #e2e8f0;
        }
        .prose-dibi blockquote {
            border-left: 3px solid #7c3aed;
            padding-left: 1rem;
            color: #9ca3af;
            font-style: italic;
            margin: 1.5em 0;
        }
        .prose-dibi ul, .prose-dibi ol {
            padding-left: 1.5em;
            margin: 1em 0;
        }
        .prose-dibi li {
            margin: 0.5em 0;
        }
        .prose-dibi table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            font-size: 0.9rem;
        }
        .prose-dibi th, .prose-dibi td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.75rem 1rem;
            text-align: left;
        }
        .prose-dibi th {
            background: rgba(124, 58, 237, 0.2);
            font-weight: 600;
            color: #e2e8f0;
        }
        .prose-dibi tr:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }
        .prose-dibi img {
            border-radius: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 1.5em 0;
        }
        
        /* Touch optimization */
        * { -webkit-tap-highlight-color: transparent; }
        button, a, [role="button"] { cursor: pointer; touch-action: manipulation; }
    </style>
</head>
<body class="min-h-screen bg-deep-900 text-gray-100">
    {{ partial "nav.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
</body>
</html>
