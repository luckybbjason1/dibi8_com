<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "zh-CN" }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Dibi8</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}发现最佳AI工具，比较功能、价格和评价{{ end }}">
    <meta name="keywords" content="AI工具,人工智能,工具导航,Dibi8">
    <meta name="author" content="Dibi8 Team">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:title" content="{{ .Title }} | Dibi8">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}发现最佳AI工具{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="Dibi8">
    <meta property="og:locale" content="zh_CN">
    {{ if .IsPage }}
    <meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
    <meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
    {{ with .Params.tags }}
    {{ range first 3 . }}
    <meta property="article:tag" content="{{ . }}">
    {{ end }}
    {{ end }}
    {{ end }}
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }} | Dibi8">
    <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}发现最佳AI工具{{ end }}">
    <meta name="twitter:url" content="{{ .Permalink }}">
    
    <link rel="canonical" href="{{ .Permalink }}">
    
    <!-- RSS Feed -->
    {{ if .IsHome }}
    <link rel="alternate" type="application/rss+xml" title="Dibi8 RSS" href="/index.xml">
    <link rel="alternate" type="application/atom+xml" title="Dibi8 Atom" href="/atom.xml">
    {{ else }}
    <link rel="alternate" type="application/rss+xml" title="{{ .Title }} - Dibi8" href="/index.xml">
    {{ end }}
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 移动端优化 */
        html {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            background-color: #f9fafb;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #111827;
            line-height: 1.6;
        }
        
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        button, a, [role="button"] {
            cursor: pointer;
            touch-action: manipulation;
        }
        
        /* 流畅滚动 */
        html {
            scroll-behavior: smooth;
        }
        
        /* 防止文本选择 */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* 触摸反馈 */
        .tap-feedback {
            transition: transform 0.1s ease, opacity 0.1s ease;
        }
        
        .tap-feedback:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
    {{ partial "nav.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
    {{ partial "search-modal.html" . }}
</body>
</html>
