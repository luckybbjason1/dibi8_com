<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "zh-CN" }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Dibi8</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}发现最佳AI工具，比较功能、价格和评价{{ end }}">
    <meta name="keywords" content="AI工具,人工智能,工具导航,Dibi8">
    <meta name="author" content="Dibi8 Team">
    <meta name="robots" content="index, follow">
    
    <link rel="canonical" href="{{ .Permalink }}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
    {{ partial "nav.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
    {{ partial "search-modal.html" . }}
</body>
</html>
