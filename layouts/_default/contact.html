{{ define "title" }}{{ .Title }} | Dibi8{{ end }}
{{ define "main" }}
<section class="pt-32 pb-20 px-6">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-12">
            <span class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-50 text-blue-600 text-2xl mb-6">
                <i class="fas fa-envelope"></i>
            </span>
            <h1 class="text-4xl font-bold mb-4">{{ .Title }}</h1>
            <p class="text-gray-500 text-lg">{{ .Params.description }}</p>
        </div>
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
            <p class="text-gray-600 mb-6 text-center">联系我们：{{ range where .Site.Home.Data "key" "contact_email" }}{{ .Value }}{{ end }}</p>
            <form action="mailto:{{ .Site.Params.email }}" method="post" enctype="text/plain" class="space-y-4">
                <input type="text" name="name" placeholder="您的姓名" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all">
                <input type="email" name="email" placeholder="您的邮箱" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all">
                <textarea name="message" placeholder="留言内容" rows="5" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all resize-none"></textarea>
                <button type="submit" class="w-full py-3.5 bg-gray-900 hover:bg-gray-800 text-white font-medium rounded-xl transition-colors">发送消息</button>
            </form>
        </div>
    </div>
</section>
{{ end }}
