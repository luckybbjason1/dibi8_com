{{- define "main" }}
<div class="min-h-screen bg-deep-900">
    <div class="max-w-4xl mx-auto px-4 py-24">
        <!-- Header -->
        <header class="mb-12">
            <nav class="text-sm text-gray-500 mb-6" aria-label="Breadcrumb">
                <a href="/" class="hover:text-neon-purple transition-colors">首页</a>
                <span class="mx-2">/</span>
                <span class="text-gray-300">{{ .Title }}</span>
            </nav>
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">{{ .Title }}</h1>
        </header>

        <!-- Content -->
        <article class="prose-dibi">
            {{ .Content }}
        </article>

        <!-- Back Link -->
        <div class="mt-12 pt-8 border-t border-white/10">
            <a href="/" class="inline-flex items-center gap-2 text-neon-purple hover:text-neon-cyan transition-colors">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                <span>返回首页</span>
            </a>
        </div>
    </div>
</div>
{{- end }}
