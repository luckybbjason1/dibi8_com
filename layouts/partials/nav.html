<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    const icon = document.getElementById('mobileMenuIcon');
    const button = document.querySelector('[aria-label="切换菜单"]');
    
    menu.classList.toggle('hidden');
    const isExpanded = !menu.classList.contains('hidden');
    
    if (isExpanded) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
        button.setAttribute('aria-expanded', 'true');
    } else {
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
        button.setAttribute('aria-expanded', 'false');
    }
}

// Close mobile menu when clicking outside
document.addEventListener('click', function(e) {
    const menu = document.getElementById('mobileMenu');
    const button = e.target.closest('[aria-label="切换菜单"]');
    if (menu && !menu.contains(e.target) && !button) {
        menu.classList.add('hidden');
        const icon = document.getElementById('mobileMenuIcon');
        icon.classList.add('fa-bars');
        icon.classList.remove('fa-times');
        document.querySelector('[aria-label="切换菜单"]').setAttribute('aria-expanded', 'false');
    }
});

// Smooth scroll for anchor links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        
        const target = document.querySelector(targetId);
        if (target) {
            e.preventDefault();
            target.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
            
            // Close mobile menu if open
            const menu = document.getElementById('mobileMenu');
            if (!menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
                const icon = document.getElementById('mobileMenuIcon');
                icon.classList.add('fa-bars');
                icon.classList.remove('fa-times');
            }
        }
    });
});
</script>
