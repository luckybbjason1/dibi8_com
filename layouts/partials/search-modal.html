<!-- 搜索弹窗（全站通用） -->
<div id="search-modal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" onclick="closeSearch()"></div>
    <div class="relative max-w-2xl mx-auto mt-24 bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">
        <div class="flex items-center gap-3 px-5 py-4 border-b border-gray-100">
            <i class="fas fa-search text-gray-400 text-sm"></i>
            <input id="search-input" type="text" placeholder="搜索 AI 工具、框架、标签…"
                   class="flex-1 outline-none text-[15px] bg-transparent placeholder-gray-400"
                   autocomplete="off">
            <kbd class="text-[11px] text-gray-400 border border-gray-200 rounded px-1.5 py-0.5 font-mono">Esc</kbd>
        </div>
        <div id="search-results" class="max-h-[420px] overflow-y-auto p-2"></div>
    </div>
</div>

<script>
(function () {
    var searchData = [];
    fetch('search-index.json')
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (d) { searchData = Array.isArray(d) ? d : []; renderResults(''); })
        .catch(function () { renderResults(''); });

    window.openSearch = function () {
        var m = document.getElementById('search-modal');
        m.classList.remove('hidden');
        setTimeout(function () {
            var i = document.getElementById('search-input');
            i.value = '';
            i.focus();
            renderResults('');
        }, 50);
    };

    window.closeSearch = function () {
        document.getElementById('search-modal').classList.add('hidden');
    };

    document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            openSearch();
        }
        if (e.key === 'Escape') closeSearch();
    });

    var input = document.getElementById('search-input');
    input.addEventListener('input', function () {
        renderResults(input.value);
    });

    function score(q, t) {
        q = q.trim().toLowerCase();
        if (!q) return 1;
        if (t.title.toLowerCase().indexOf(q) !== -1) return 3;
        if (t.cat.toLowerCase().indexOf(q) !== -1) return 2;
        if (t.desc.toLowerCase().indexOf(q) !== -1) return 1;
        // token match
        var words = q.split(/\s+/);
        var hay = (t.title + ' ' + t.desc + ' ' + t.cat).toLowerCase();
        for (var i = 0; i < words.length; i++) {
            if (words[i] && hay.indexOf(words[i]) === -1) return 0;
        }
        return 1;
    }

    function renderResults(q) {
        var box = document.getElementById('search-results');
        var hits = searchData
            .map(function (t) { return { t: t, s: score(q, t) }; })
            .filter(function (x) { return x.s > 0; })
            .sort(function (a, b) { return b.s - a.s; })
            .slice(0, 12);

        if (!hits.length) {
            box.innerHTML = '<div class="search-empty">' +
                (q ? '没有找到与「' + q + '」相关的工具' : '输入关键词开始搜索') + '</div>';
            return;
        }

        box.innerHTML = hits.map(function (x) {
            var cat = x.t.cat ? x.t.cat.replace(/-/g, ' ') : '工具';
            return '<a class="search-row" href="' + x.t.url + '">' +
                '<span class="shrink-0 px-2 py-1 text-[11px] font-medium bg-blue-50 text-blue-600 rounded-md border border-blue-100">' + cat + '</span>' +
                '<span class="text-[14px] font-medium text-gray-900 truncate">' + x.t.title + '</span>' +
                '<i class="fas fa-arrow-right text-[10px] text-gray-300 ml-auto shrink-0"></i>' +
                '</a>';
        }).join('');
    }
})();
</script>
