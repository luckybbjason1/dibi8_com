{{ define "title" }}{{ .Title }} | Dibi8 - AI工具目录{{ end }}
{{ define "main" }}
<section class="pt-32 pb-20 px-6">
    <div class="max-w-4xl mx-auto">
        <nav class="text-sm text-gray-400 mb-8" aria-label="面包屑导航">
            <a href="/" class="hover:text-gray-600">首页</a>
            <span class="mx-2">/</span>
            <span class="text-gray-900">{{ .Title }}</span>
        </nav>
        
        <div class="text-center mb-12">
            <span class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-50 text-blue-600 text-2xl mb-6" aria-hidden="true">
                <i class="fas fa-info-circle"></i>
            </span>
            <h1 class="text-4xl md:text-5xl font-bold mb-4">{{ .Title }}</h1>
            <p class="text-gray-500 text-lg">专注AI工具发现与导航的平台</p>
        </div>
        
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100 prose prose-lg max-w-none">
            {{ .Content }}
        </div>
        
        <div class="mt-8 text-center">
            <a href="/" class="text-blue-600 hover:underline" aria-label="返回首页">← 返回首页</a>
        </div>
    </div>
</section>
{{ end }}
