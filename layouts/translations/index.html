<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多语言翻译 | {{ .Site.Title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            0: '#09090b',
                            1: '#18181b',
                            2: '#27272a',
                        },
                        accent: {
                            DEFAULT: '#6366f1',
                            light: '#818cf8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #09090b; }
        .lang-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        .lang-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen text-zinc-100">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 border-b border-white/5 bg-[#09090b]/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                    <i class="fas fa-bolt text-white text-sm"></i>
                </div>
                <span class="font-semibold">Dibi8</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/" class="text-sm text-zinc-400 hover:text-white">首页</a>
                <a href="/categories/" class="text-sm text-zinc-400 hover:text-white">分类</a>
                <div class="flex items-center gap-2 px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-lg">
                    <i class="fas fa-globe text-zinc-500 text-xs"></i>
                    <span class="text-xs text-zinc-400">多语言</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="pt-24 pb-16 px-6">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-12">
                <div class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-500/10 border border-indigo-500/20 rounded-full text-sm text-indigo-400 mb-6">
                    <i class="fas fa-language"></i>
                    支持 8 种语言
                </div>
                <h1 class="text-4xl md:text-5xl font-bold mb-4">
                    选择您的语言
                </h1>
                <p class="text-zinc-400 text-lg max-w-2xl mx-auto">
                    浏览 Dibi8 AI工具目录，体验多语言支持
                </p>
            </div>

            <!-- Language Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                <a href="/" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇨🇳</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">中文</h3>
                    <p class="text-sm text-zinc-500 mt-1">简体中文</p>
                </a>
                <a href="https://translate.google.com/translate?sl=zh&tl=en&u=" target="_blank" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇺🇸</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">English</h3>
                    <p class="text-sm text-zinc-500 mt-1">英语</p>
                </a>
                <a href="https://translate.google.com/translate?sl=zh&tl=ko&u=" target="_blank" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇰🇷</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">한국어</h3>
                    <p class="text-sm text-zinc-500 mt-1">韩语</p>
                </a>
                <a href="https://translate.google.com/translate?sl=zh&tl=vi&u=" target="_blank" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇻🇳</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">Tiếng Việt</h3>
                    <p class="text-sm text-zinc-500 mt-1">越南语</p>
                </a>
                <a href="https://translate.google.com/translate?sl=zh&tl=ja&u=" target="_blank" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇯🇵</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">日本語</h3>
                    <p class="text-sm text-zinc-500 mt-1">日语</p>
                </a>
                <a href="https://translate.google.com/translate?sl=zh&tl=fr&u=" target="_blank" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇫🇷</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">Français</h3>
                    <p class="text-sm text-zinc-500 mt-1">法语</p>
                </a>
                <a href="https://translate.google.com/translate?sl=zh&tl=de&u=" target="_blank" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇩🇪</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">Deutsch</h3>
                    <p class="text-sm text-zinc-500 mt-1">德语</p>
                </a>
                <a href="https://translate.google.com/translate?sl=zh&tl=es&u=" target="_blank" class="lang-card p-6 rounded-2xl text-center group">
                    <div class="text-4xl mb-3">🇪🇸</div>
                    <h3 class="font-semibold text-lg group-hover:text-indigo-400">Español</h3>
                    <p class="text-sm text-zinc-500 mt-1">西班牙语</p>
                </a>
            </div>

            <!-- Translation Notice -->
            <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-6 text-center">
                <div class="text-3xl mb-3">ℹ️</div>
                <h3 class="font-semibold text-lg mb-2">自动翻译提示</h3>
                <p class="text-zinc-400 text-sm max-w-2xl mx-auto">
                    当前网站主要提供简体中文版本。其他语言通过Google Translate自动翻译，
                    如需精准翻译请查看我们的多语言内容计划。
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 py-8 px-6">
        <div class="max-w-6xl mx-auto text-center text-sm text-zinc-600">
            © 2026 Dibi8.com — 发现最佳AI工具
        </div>
    </footer>
</body>
</html>
